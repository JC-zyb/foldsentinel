[package]
name = "foldsentinel-desktop"
version = "0.8.0"
edition = "2024"
license = "MIT"
default-run = "FoldSentinel"

[[bin]]
name = "FoldSentinel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
foldsentinel = { path = ".." }
serde = { version = "1", features = ["derive"] }
zeroize = "1.8"
anyhow = "1.0"
serde_json = "1.0"
walkdir = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
