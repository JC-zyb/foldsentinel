name: Windows build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows attribute state validation
        run: cargo run --release --locked --example validate_attributes -- --report ./v08-attributes-windows-x64.json
      - name: Isolated service uninstall validation
        run: ./scripts/validate-service-uninstall.ps1 | Out-File -LiteralPath ./v08-service-uninstall-windows-x64.json -Encoding utf8
      - run: cargo build --release --locked --example validate_v04
      - name: Real IO and isolated volume full
        run: ./scripts/validate-volume.ps1 -Report ./v04-io-windows-x64.json
      - run: ./scripts/package.ps1
      - name: Isolated NSIS uninstall-hook validation
        run: ./scripts/validate-uninstall-hooks.ps1 -Report ./v08-uninstall-hooks-windows-x64.json
      - name: Installer upgrade and uninstall smoke
        run: ./scripts/validate-install.ps1 -Report ./v08-install-windows-x64.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: FoldSentinel-validation
          path: |
            v04-io-windows-x64.json
            v08-install-windows-x64.json
            v08-uninstall-hooks-windows-x64.json
            v08-service-uninstall-windows-x64.json
            v08-attributes-windows-x64.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: FoldSentinel-windows-x64
          path: artifacts/*
          if-no-files-found: error
