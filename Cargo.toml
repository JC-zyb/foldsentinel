[package]
name = "foldsentinel"
version = "0.2.0"
edition = "2024"
description = "Open-source Windows folder protection and encrypted vault tooling."
license = "MIT"
repository = "https://github.com/JC-zyb/foldsentinel"
readme = "README.md"
autobins = false
default-run = "foldsentinel-cli"

[[bin]]
name = "foldsentinel-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.10", features = ["zeroize", "stream"] }
argon2 = { version = "0.5", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.4"
rand = "0.8"
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
tar = "0.4"
tempfile = "3.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
sha2 = "0.10"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"
