[package]
name = "foldsentinel"
version = "0.1.0"
edition = "2024"
description = "Open-source Windows folder protection and encrypted vault tooling."
license = "MIT"
repository = "https://github.com/JC-zyb/foldsentinel"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.13"
